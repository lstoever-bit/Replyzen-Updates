name: Build Replyzen Update

on:
  push:
    branches: [main]
    paths:
      - 'v17/**'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare current Replyzen source
        run: |
          rm -rf buildsrc Replyzen-source.zip
          (cat sourcefix/part-*.b64; cat source2/part-02.b64 source2/part-03.b64) | tr -d '\n\r ' | /usr/bin/base64 -D > Replyzen-source.zip
          unzip -t Replyzen-source.zip
          mkdir buildsrc
          ditto -x -k Replyzen-source.zip buildsrc
          cp source-current/Build-CI.sh buildsrc/Build-CI.sh
          cp source-current/app/*.swift buildsrc/app/
          cp source-current/app/Info.plist buildsrc/app/Info.plist
      - name: Apply Replyzen 1.7 window fixes
        run: |
          cp v17/FloatingPanelController.swift buildsrc/app/FloatingPanelController.swift
          cp v17/ReplyzenApp.swift buildsrc/app/ReplyzenApp.swift
          cp v17/Info.plist buildsrc/app/Info.plist
          cp v17/Build-CI.sh buildsrc/Build-CI.sh
      - name: Build update package
        run: |
          cd buildsrc
          chmod +x Build-CI.sh
          ./Build-CI.sh
      - name: Publish Replyzen 1.7 update and source snapshot
        run: |
          cp buildsrc/Replyzen-update.zip ./Replyzen-update.zip
          cp buildsrc/update.json ./update.json
          rm -rf source-current
          mkdir -p source-current/app
          cp buildsrc/Build-CI.sh source-current/Build-CI.sh
          cp buildsrc/app/*.swift source-current/app/
          cp buildsrc/app/Info.plist source-current/app/Info.plist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Replyzen-update.zip update.json source-current
          if git diff --cached --quiet; then
            echo "No update artifact changes"
            exit 0
          fi
          git commit -m "Build Replyzen 1.7 window fix update"
          git push
