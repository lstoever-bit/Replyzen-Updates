name: Build Replyzen Update

on:
  push:
    branches: [main]
    paths:
      - 'patch14/part-*.patch'
      - 'patch15/*.patch'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble Replyzen 1.3 source
        run: |
          rm -rf buildsrc Replyzen-source.zip replyzen-v1.4.patch replyzen-v1.5.patch
          (cat sourcefix/part-*.b64; cat source2/part-02.b64 source2/part-03.b64) | tr -d '\n\r ' | /usr/bin/base64 -D > Replyzen-source.zip
          unzip -t Replyzen-source.zip
          mkdir buildsrc
          ditto -x -k Replyzen-source.zip buildsrc
      - name: Apply Replyzen 1.4 patch
        run: |
          cat patch14/part-*.patch > replyzen-v1.4.patch
          cd buildsrc
          patch -p2 < ../replyzen-v1.4.patch
      - name: Apply Replyzen 1.5 patch
        run: |
          cp patch15/replyzen-v1.5.patch replyzen-v1.5.patch
          cd buildsrc
          patch -p2 < ../replyzen-v1.5.patch
      - name: Build update package
        run: |
          cd buildsrc
          chmod +x Build-CI.sh
          ./Build-CI.sh
      - name: Publish update files
        run: |
          cp buildsrc/Replyzen-update.zip ./Replyzen-update.zip
          cp buildsrc/update.json ./update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Replyzen-update.zip update.json
          if git diff --cached --quiet; then
            echo "No update artifact changes"
            exit 0
          fi
          git commit -m "Build Replyzen 1.5 update"
          git push
