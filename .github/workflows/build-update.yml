name: Build ReplyZen Update

on:
  push:
    branches: [main, codex/replyzen-cleanup-1.43]
    paths:
      - 'source-current/**'
      - 'maintenance/**'
      - 'tests/**'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replyzen-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore legacy resources once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f source-current/app/Resources/ReplyzenLogo.png ]; then
            LEGACY="$(mktemp -d)"
            trap 'rm -rf "$LEGACY"' EXIT
            (cat sourcefix/part-*.b64; cat source2/part-02.b64 source2/part-03.b64) | tr -d '\n\r ' | /usr/bin/base64 -D > "$LEGACY/source.zip"
            unzip -t "$LEGACY/source.zip"
            ditto -x -k "$LEGACY/source.zip" "$LEGACY/source"
            mkdir -p source-current/app/Resources
            cp -R "$LEGACY/source/app/Resources/." source-current/app/Resources/
          fi
      - name: Apply checked 1.43 source cleanup if needed
        run: python3 maintenance/refactor_1_43.py source-current
      - name: Run regression checks without API access
        run: bash tests/run-tests.sh source-current
      - name: Build and verify native app
        run: bash source-current/Build-CI.sh
      - name: Verify updater archive and manifest
        run: python3 tests/verify_update.py source-current
      - name: Save canonical source and publish main update only
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f source-current/app source-current/Build-CI.sh source-current/Release-notes.txt
          if [ "$BRANCH" = main ]; then
            PACKAGE="$(python3 -c 'import json; print(json.load(open("source-current/update.json"))["download_url"])')"
            VERSION="$(python3 -c 'import json; print(json.load(open("source-current/update.json"))["version"])')"
            cp "source-current/$PACKAGE" "$PACKAGE"
            cp source-current/update.json update.json
            cp source-current/update.json "update-${VERSION%.0}.json"
            git add -f "$PACKAGE" update.json "update-${VERSION%.0}.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Build ReplyZen 1.43 and preserve tested source"
            git push origin "HEAD:$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ReplyZen-1.43-build
          path: |
            source-current/Replyzen-update-*.zip
            source-current/update.json
          if-no-files-found: error
          retention-days: 7
