name: Build Replyzen Update

on:
  push:
    branches: [main]
    paths:
      - 'source2/part-*.b64'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source
        run: |
          rm -rf buildsrc Replyzen-source.zip
          cat source2/part-*.b64 | tr -d '\n\r ' | /usr/bin/base64 -D > Replyzen-source.zip
          unzip -t Replyzen-source.zip
          mkdir buildsrc
          ditto -x -k Replyzen-source.zip buildsrc
      - name: Build update package
        run: |
          cd buildsrc
          chmod +x Build-CI.sh
          ./Build-CI.sh
      - name: Publish update files
        run: |
          cp buildsrc/Replyzen-update.zip ./Replyzen-update.zip
          cp buildsrc/update.json ./update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Replyzen-update.zip update.json
          if git diff --cached --quiet; then
            echo "No update artifact changes"
            exit 0
          fi
          git commit -m "Build Replyzen update"
          git push
