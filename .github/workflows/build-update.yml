name: Build ReplyZen Update
on:
  push:
    branches: [main, codex/replyzen-remove-payment-windowfix-1.55]
    paths:
      - 'source-current/**'
      - 'maintenance/remove_payment_window_1_55.py'
      - 'maintenance/pre_1_55_overlay.py'
      - 'tests/**'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: replyzen-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Remove final legacy Payment title
        run: python3 maintenance/pre_1_55_overlay.py source-current
      - name: Apply checked 1.55 migration
        run: python3 maintenance/remove_payment_window_1_55.py source-current
      - name: Existing regression and typography tests
        run: bash tests/run-tests.sh source-current
      - name: Localization and mail language tests
        run: bash tests/run-localization-tests.sh source-current
      - name: Window lifecycle and Outlook overlay drag tests
        run: bash tests/run-window-position-tests.sh source-current
      - name: Build and verify native app from canonical source
        run: bash source-current/Build-CI.sh
      - name: Verify exact updater archive and manifest
        run: python3 tests/verify_update.py source-current
      - name: Preserve tested canonical 1.55 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source-current/app source-current/Release-notes.txt source-current/Release-notes.localized.json tests
          if ! git diff --cached --quiet; then
            git commit -m "Build ReplyZen 1.55 without Payment and stabilize window"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Publish verified main update
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(python3 -c 'import json; print(json.load(open("source-current/update.json"))["download_url"])')"
          VERSION="$(python3 -c 'import json; print(json.load(open("source-current/update.json"))["version"])')"
          cp "source-current/$PACKAGE" "$PACKAGE"
          cp source-current/update.json update.json
          cp source-current/update.json "update-${VERSION%.0}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$PACKAGE" update.json "update-${VERSION%.0}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Publish ReplyZen $VERSION payment removal and window fix"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReplyZen-1.55-build
          path: |
            source-current/Replyzen-update-*.zip
            source-current/update.json
          if-no-files-found: warn
          retention-days: 7
