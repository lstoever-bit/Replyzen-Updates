name: Build Replyzen Update

on:
  push:
    branches: [main]
    paths:
      - 'v49/**'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare current Replyzen source
        run: |
          rm -rf buildsrc Replyzen-source.zip
          (cat sourcefix/part-*.b64; cat source2/part-02.b64 source2/part-03.b64) | tr -d '\n\r ' | /usr/bin/base64 -D > Replyzen-source.zip
          unzip -t Replyzen-source.zip
          mkdir buildsrc
          ditto -x -k Replyzen-source.zip buildsrc
          cp source-current/Build-CI.sh buildsrc/Build-CI.sh
          cp source-current/app/*.swift buildsrc/app/
          cp source-current/app/Info.plist buildsrc/app/Info.plist
      - name: Apply Replyzen 1.36 direct calendar flow
        run: |
          python3 v49/patch.py buildsrc
      - name: Build update package
        run: |
          cd buildsrc
          chmod +x Build-CI.sh
          ./Build-CI.sh
      - name: Publish Replyzen 1.36 update and source snapshot
        run: |
          cp buildsrc/Replyzen-update-1.36.zip ./Replyzen-update-1.36.zip
          cp buildsrc/update.json ./update.json
          cp buildsrc/update.json ./update-1.36.json
          rm -rf source-current
          mkdir -p source-current/app
          cp buildsrc/Build-CI.sh source-current/Build-CI.sh
          cp buildsrc/app/*.swift source-current/app/
          cp buildsrc/app/Info.plist source-current/app/Info.plist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Replyzen-update-1.36.zip update.json update-1.36.json source-current
          if git diff --cached --quiet; then
            echo "No update artifact changes"
            exit 0
          fi
          git commit -m "Build Replyzen 1.36 direct calendar flow"
          git push
