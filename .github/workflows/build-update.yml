name: Build ReplyZen Update
on:
  push:
    branches: [main, codex/replyzen-reply-fix-1.48]
    paths:
      - 'source-current/**'
      - 'tests/**'
      - 'maintenance/fix_reply_language_1_48.py'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: replyzen-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked ReplyZen 1.48 migration if needed
        run: python3 maintenance/fix_reply_language_1_48.py source-current
      - name: Existing regression and typography tests
        run: bash tests/run-tests.sh source-current
      - name: Localization, language detection and native workspace tests
        run: bash tests/run-localization-tests.sh source-current
      - name: Build and verify native app from canonical source
        run: bash source-current/Build-CI.sh
      - name: Verify exact updater archive and manifest
        run: python3 tests/verify_update.py source-current
      - name: Preserve tested canonical 1.48 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f source-current/app source-current/Release-notes.txt source-current/Release-notes.localized.json \
            tests/ClientStubs.swift tests/test_source_contracts.py tests/verify_update.py tests/run-localization-tests.sh
          if ! git diff --cached --quiet; then
            git commit -m "Build ReplyZen 1.48 reply and language fixes"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Publish verified main update
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(python3 -c 'import json; print(json.load(open("source-current/update.json"))["download_url"])')"
          VERSION="$(python3 -c 'import json; print(json.load(open("source-current/update.json"))["version"])')"
          cp "source-current/$PACKAGE" "$PACKAGE"
          cp source-current/update.json update.json
          cp source-current/update.json "update-${VERSION%.0}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$PACKAGE" update.json "update-${VERSION%.0}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Publish ReplyZen $VERSION reply and language update"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReplyZen-1.48-build
          path: |
            source-current/Replyzen-update-*.zip
            source-current/update.json
            source-current/.ui-previews/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
