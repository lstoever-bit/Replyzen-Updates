# ReplyZen 1.74 stable Reply window binding
name: Build ReplyZen Update
on:
  push:
    branches: [main, codex/replyzen-1.74-window-binding]
    paths:
      - 'source-current/**'
      - 'maintenance/replyzen_1_74_window_binding.py'
      - 'tests/**'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: replyzen-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Integrate stable Reply window binding
        run: python3 maintenance/replyzen_1_74_window_binding.py source-current
      - name: Reply window transition and write-lease regression tests
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          swiftc -parse-as-library source-current/app/ReplyWindowTracker.swift source-current/app/ReplyInsertionPolicy.swift tests/ReplyWindowTrackerTests.swift -o "$TMP/window-tests"
          "$TMP/window-tests"
          python3 tests/test_window_binding_contract.py source-current
      - name: Focus handoff and missing subject regression tests
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          swiftc -parse-as-library source-current/app/ReplyRecoveryRules.swift source-current/app/NewMailSubject.swift source-current/app/ChatGPTTransferPayload.swift source-current/app/MailPromptBuilder.swift tests/ReplyRecoveryTests.swift -o "$TMP/recovery-tests"
          "$TMP/recovery-tests"
          swiftc -parse-as-library source-current/app/ReplyInsertionPolicy.swift tests/ReplyInsertionPolicyTests.swift -o "$TMP/reply-tests"
          "$TMP/reply-tests"
          swiftc -parse-as-library source-current/app/ReplyEditorSupport.swift tests/ReplyEditorSupportTests.swift -o "$TMP/editor-tests"
          "$TMP/editor-tests"
      - name: Existing regression, prompt and typography tests
        run: bash tests/run-tests.sh source-current
      - name: Localization and mail language tests
        run: bash tests/run-localization-tests.sh source-current
      - name: Outlook meeting invite context tests
        run: bash tests/run-calendar-invite-tests.sh source-current
      - name: Window lifecycle and Outlook overlay drag tests
        run: bash tests/run-window-position-tests.sh source-current
      - name: Overlay restore lifecycle contract
        run: python3 tests/overlay_restore_contract.py source-current
      - name: Build and verify native app from canonical source
        run: bash source-current/Build-CI.sh
      - name: Verify exact updater archive and manifest
        run: python3 tests/verify_update.py source-current
      - name: Preserve tested canonical 1.74 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source-current/app source-current/Release-notes.txt source-current/Release-notes.localized.json tests
          if ! git diff --cached --quiet; then
            git commit -m "Build ReplyZen 1.74 stable Reply window binding"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Publish verified main update
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(python3 -c 'import json; print(json.load(open("source-current/update.json"))["download_url"])')"
          VERSION="$(python3 -c 'import json; print(json.load(open("source-current/update.json"))["version"])')"
          cp "source-current/$PACKAGE" "$PACKAGE"
          cp source-current/update.json update.json
          cp source-current/update.json "update-${VERSION%.0}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$PACKAGE" update.json "update-${VERSION%.0}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Publish ReplyZen $VERSION stable Reply window binding"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReplyZen-1.74-build
          path: |
            source-current/Replyzen-update-*.zip
            source-current/update.json
          if-no-files-found: warn
          retention-days: 7
